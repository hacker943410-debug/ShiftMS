model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
personality = "pragmatic"

[features]
multi_agent = true
shell_snapshot = true
undo = true

[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 1800

[agents.explorer]
description = """
Economy read-only repository exploration. Return evidence and file paths;
do not make design decisions or edit files."""
config_file = "agents/explorer.toml"

[agents.handoff_planner]
description = """
Balanced read-only implementation planning for a Gemini handoff.
Propose exact changes, invariants, failure modes, and tests without editing files."""
config_file = "agents/builder.toml"

[agents.reviewer]
description = """
Balanced read-only review focused on correctness, Electron boundaries, data safety,
and regression evidence. The primary agent owns the final verdict."""
config_file = "agents/reviewer.toml"

[agents.diagnostician]
description = """
Balanced read-only diagnosis with one bounded hypothesis. Reproduce or trace the
failure and report evidence; do not patch tracked files."""
config_file = "agents/debugger.toml"

[agents.tester]
description = """
Economy verification agent for commands selected by the primary agent.
Run checks and report exact results without changing tracked files."""
config_file = "agents/tester.toml"
