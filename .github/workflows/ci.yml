name: CI

# Code-verification gate for ShiftMgmt_V3.4.
# Runs on a self-hosted Linux runner (e.g. a WSL Ubuntu 24.04 runner) because the project
# pins Node >=24 <25 (node:sqlite is a built-in experimental API). The electron runtime
# binary is intentionally skipped — typecheck, vitest (jsdom) and the build (vite + tsc)
# do not need it, which keeps installs fast and avoids the ~100MB download.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build (renderer + electron main)
        run: npm run build
