name: CI

# Code-verification gate for ShiftMgmt_V3.4.
# Runs on a self-hosted Linux runner (e.g. a WSL Ubuntu 24.04 runner) because the project
# pins Node >=24 <25 (node:sqlite is a built-in experimental API). Electron IS installed so the
# document-export / proposal / pdf suites (which import electron) can run. The few unit tests that
# assert Windows path.basename / path.isAbsolute semantics are guarded with runIf(win32) and skip
# here. For a fully faithful run, a self-hosted Windows runner is the closest match to the target.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build (renderer + electron main)
        run: npm run build
