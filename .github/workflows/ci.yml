name: CI

# Code-verification gate for ShiftMgmt_V3.4.
# Runs on GitHub-hosted ubuntu-latest with Node 24 (node:sqlite is a built-in experimental API on
# Node >=24). Electron is installed via `npm ci` so the document-export / proposal / pdf suites
# (which import electron) can run; no display is needed because the tests do not open a window.
# The few unit tests that assert Windows path.basename / path.isAbsolute semantics are guarded with
# runIf(win32) and skip here. (A self-hosted Windows runner is the closest match to the target OS,
# but GitHub-hosted Linux keeps the gate actually running instead of queuing on an offline runner.)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build (renderer + electron main)
        run: npm run build
